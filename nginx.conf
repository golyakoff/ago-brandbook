# `15-08`'s own fix, carried in from the start: this image serves a handful of fixed-filename files
# (index.html, styles.css, tokens.js, the icons, version.json), and stock nginx sends no
# Cache-Control at all for a static file with no directive naming one - found live via ago-widget and
# ago-landing, which shared the identical gap (full incident: ago-root's own
# docs/backlog/15-08-static-frontend-cache-headers.md).
#
# `no-cache` (despite the name) does not mean "never cache" - it means "never trust a cached copy
# without asking first". nginx already sends ETag/Last-Modified for every static file by default, so
# a revalidation is one small conditional request answered with a cheap 304 when nothing changed.
# There is no hashed-filename asset class here to treat differently (this repository has no build
# step at all) - one policy for every file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
